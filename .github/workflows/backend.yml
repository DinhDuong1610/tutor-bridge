# Build, architecture and integration tests on real PostgreSQL. Runs only when the backend or its
# migration sources change, to save CI minutes on GitHub Free.
name: backend

on:
  pull_request:
    branches: [dev, main]
    paths: &backend-paths
      - backend/**
      - infra/db-init/**
      - docs/appendix/g3_ky_thuat_v0_1/sql/**
      - docs/design/migrations-proposed/**
      - .github/workflows/backend.yml
  push:
    branches: [dev]
    paths: *backend-paths

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Compiles with warnings as errors, then runs every test: architecture, migrations from an
      # empty database, privileges, platform, and the TX05 concurrency tests.
      - name: backend-build
        run: ./gradlew build

      - name: test-report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
