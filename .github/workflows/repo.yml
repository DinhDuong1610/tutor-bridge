# Cheap checks on every pull request, see docs/process/ci.md.
name: repo

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every check runs even after one fails, so the author sees all problems at once.
      - name: skills-sync
        if: ${{ !cancelled() }}
        run: sh scripts/ci/skills-sync.sh

      - name: immutable-history
        if: ${{ !cancelled() }}
        run: sh scripts/ci/immutable-history.sh "$BASE_SHA"

      - name: hooks
        if: ${{ !cancelled() }}
        run: sh scripts/ci/hooks.sh

      - name: no-handoff
        if: ${{ !cancelled() && !github.event.pull_request.draft }}
        run: sh scripts/ci/no-handoff.sh

      - name: secrets-scan
        if: ${{ !cancelled() }}
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --log-opts="$BASE_SHA..HEAD"

      - name: pr-format
        if: ${{ !cancelled() }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/ci/pr-format.py
