spring:
  flyway:
    enabled: true
  # Mailpit from infra/compose.yaml. Messages stay on this machine: http://localhost:8025
  mail:
    host: 127.0.0.1
    port: ${MAILPIT_SMTP_PORT:1025}
logging:
  structured:
    format:
      # Plain text on a developer machine, masked like the JSON logs (Issue #85).
      console: com.tutorbridge.platform.web.RedactedTextLogFormatter
tutorbridge:
  identity:
    # Trial terms with no legal effect, until Đính provides the text (Q8 of TB-8).
    terms-versions: ${TB_TERMS_VERSIONS:ban-thu-chua-hieu-luc}
    # Under build/, which git ignores; ./gradlew clean empties it.
    evidence:
      dir: ${TB_EVIDENCE_DIR:build/local-evidence}
    mail:
      from: no-reply@tutorbridge.invalid
      # Opens the app on a developer phone. Release builds use an https domain (Q7 of TB-10).
      link-base: tutorbridge://
  # One process plays both roles on a developer machine.
  worker:
    enabled: true
  security:
    # Next.js dev server. Cookie writes from any other origin are rejected (ADR-0010).
    admin-origins: http://localhost:3000
    # The Next.js dev server calls the API from this machine and sends the browser's address in
    # X-TB-Client-IP, which only these addresses may do (#252). Empty, the default, believes nobody.
    trusted-web-proxies: 127.0.0.1,::1
