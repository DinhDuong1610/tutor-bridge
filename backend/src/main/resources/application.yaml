spring:
  application:
    name: tutorbridge
  mail:
    default-encoding: UTF-8
  autoconfigure:
    # Sessions come from SessionResolver (ADR-0010). No in-memory user with a generated password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${TB_DB_URL:jdbc:postgresql://127.0.0.1:55432/tutorbridge?currentSchema=tutorbridge,public}
    username: tutorbridge_app
    password: ${TB_APP_PASSWORD}
  flyway:
    # The runtime account cannot change the schema. Migrations run with the owner account only.
    enabled: false
    default-schema: public
    user: tutorbridge_migrator
    password: ${TB_MIGRATOR_PASSWORD:}
logging:
  level:
    # At DEBUG these two print every request and response body with the record's toString(), a child's
    # name and goal included (INV-63, #203). Pinned here, DEBUG=true or logging.level.web=DEBUG no longer
    # reaches them; the toString() masking of secrets (#198) stays as a second layer.
    org.springframework.web.servlet.mvc.method.annotation: INFO
    org.springframework.http.converter: INFO
  pattern:
    correlation: "[%X{traceId:-}] "
  structured:
    # JSON logs (Elastic Common Schema) wherever the app is deployed; MDC traceId is included.
    # The local profile switches back to plain text.
    format:
      console: ecs
    json:
      customizer: com.tutorbridge.platform.web.LogRedaction
tutorbridge:
  identity:
    # Valid RegistrationInput.termsVersion values (Q8 of TB-8). Empty: nobody can register.
    terms-versions: ${TB_TERMS_VERSIONS:}
    keys:
      # Base64 of 32 random bytes each. Required; the app refuses to start without them.
      email-digest: ${TB_EMAIL_DIGEST_KEY:}
      email-encryption: ${TB_EMAIL_ENCRYPTION_KEY:}
      link-token: ${TB_LINK_TOKEN_KEY:}
      admin-mfa: ${TB_ADMIN_MFA_KEY:}
    # Provisional values, not measured (Đính, Q6 of TB-8, 08/11/2026). Fixed windows.
    limits:
      register-per-source:
        attempts: 5
        window: 1h
      resend-per-account:
        attempts: 3
        window: 1h
      resend-per-source:
        attempts: 10
        window: 1h
      recovery-per-account:
        attempts: 3
        window: 1h
      recovery-per-source:
        attempts: 10
        window: 1h
    # Local ObjectStore for tutor evidence (#12 Q1). Required: a directory every API instance shares,
    # outside any public web root. S3 replaces it later.
    evidence:
      dir: ${TB_EVIDENCE_DIR:}
    # Read by the worker role only. SMTP itself is spring.mail.* (SPRING_MAIL_HOST, SPRING_MAIL_PORT, ...).
    mail:
      from: ${TB_MAIL_FROM:}
      link-base: ${TB_LINK_BASE:}
  # Worker role (docs/design/kien-truc.md): claims outbox events and sends email. Off on API instances.
  worker:
    enabled: ${TB_WORKER_ENABLED:false}
    # Retention cleanup (#24, ADR-0006): expired receipts, outbox events 7 days after delivery.
    cleanup:
      interval: PT1H
      batch-size: 500
      max-batches: 40
      outbox-keep: P7D
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Status only. Details would show the database and versions to anyone.
      show-details: never
      show-components: never
      probes:
        enabled: true
