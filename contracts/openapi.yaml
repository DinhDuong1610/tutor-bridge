components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque access token
    cookieAuth:
      type: apiKey
      in: cookie
      name: tb_session
      description: 'Admin web: Secure HttpOnly cookie; unsafe requests require CSRF
        and Origin validation. Never expose cookie to JS.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Random key, 16–128 characters; scoped to actor and command; keep
        receipts at least 7 days. Same key + different canonical payload -> 409.
        Missing -> 400 IDEMPOTENCY_KEY_REQUIRED; out of range -> 422 IDEMPOTENCY_KEY_INVALID
        (CR-014).
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag returned by the target resource. Missing -> 428; stale
        -> 412. Reauthorize then check known receipt before precondition on replay.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 500
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    CommandKey:
      name: idempotencyKey
      in: query
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CommandType:
      name: commandType
      in: query
      required: true
      schema:
        type: string
        maxLength: 100
        minLength: 1
  responses:
    Problem:
      description: Typed error; code is stable; never include private source content
        or answers. 404 may mask unauthorized object. 429 includes Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          maxLength: 100
        detail:
          type: string
          maxLength: 2000
        traceId:
          type: string
          maxLength: 100
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
                maxLength: 200
              message:
                type: string
                maxLength: 500
            required:
            - path
            - message
          maxItems: 50
      required:
      - type
      - title
      - status
      - code
      - detail
      - traceId
    Student:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 100
        grade:
          const: 8
          type: integer
        revision:
          type: integer
          minimum: 1
          format: int64
        shortGoal:
          type: string
          maxLength: 2000
      required:
      - id
      - displayName
      - grade
      - revision
    StudentPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Student'
          maxItems: 50
        nextCursor:
          type:
          - string
          - 'null'
          maxLength: 500
      required:
      - items
      - nextCursor
    Window:
      type: object
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      required:
      - start
      - end
    NeedDraftInput:
      type: object
      additionalProperties: false
      properties:
        goal:
          type: string
          maxLength: 2000
        budgetVndSession:
          type: integer
          minimum: 1
        durationMinutes:
          type: integer
          enum:
          - 60
          - 90
          - 120
        frequencyPer7Days:
          type: integer
          enum:
          - 1
          - 2
          - 3
        cycleStartDate:
          type: string
          format: date
        availableWindows:
          type: array
          items:
            $ref: '#/components/schemas/Window'
          maxItems: 100
        preferredWindows:
          type: array
          items:
            $ref: '#/components/schemas/Window'
          maxItems: 100
      required: []
    Need:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
          format: int64
        versionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
