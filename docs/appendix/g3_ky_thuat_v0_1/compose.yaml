name: tutorbridge-g3-execution
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: tb_g3_unified
      POSTGRES_USER: tb_review
      POSTGRES_PASSWORD_FILE: /run/secrets/review_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - review_password
    ports:
      - "127.0.0.1:${TB_REVIEW_PORT:-55434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tb_review -d tb_g3_unified"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"
secrets:
  review_password:
    file: ./secrets/review_password.txt
